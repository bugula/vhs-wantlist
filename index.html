<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>VHS Want List — Convention Edition</title>
<style>
  :root{
    --bg:#0a0708;
    --bg2:#150d0f;
    --card:#1b1214;
    --card-border:#3a1f22;
    --text:#f1e6e0;
    --muted:#a98d8a;
    --accent:#ff2b2b;
    --accent2:#ffb020;
    --found:#3fae55;
    --missing:#7a1f1f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top, #2a1013 0%, var(--bg) 55%),
      var(--bg);
    color:var(--text);
    font-family: 'Courier New', Courier, monospace;
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  header{
    position:sticky;
    top:0;
    z-index:10;
    background:linear-gradient(180deg, #1a0507 0%, #0f0405 100%);
    border-bottom:2px solid var(--accent);
    padding:14px 16px 12px;
    box-shadow:0 4px 18px rgba(0,0,0,0.6);
  }
  h1{
    margin:0 0 2px;
    font-size:1.5rem;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--accent);
    text-shadow:0 0 8px rgba(255,43,43,0.6), 0 0 2px #fff;
  }
  .subtitle{
    margin:0 0 10px;
    font-size:0.78rem;
    color:var(--muted);
  }
  .searchwrap{
    display:flex;
    gap:8px;
  }
  #search{
    flex:1;
    background:#0d0607;
    border:1px solid var(--card-border);
    color:var(--text);
    padding:10px 12px;
    font-size:1rem;
    font-family:inherit;
    border-radius:4px;
    outline:none;
  }
  #search:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 2px rgba(255,43,43,0.25);
  }
  .counts{
    font-size:0.72rem;
    color:var(--muted);
    margin-top:6px;
  }
  .counts span{color:var(--accent2);font-weight:bold;}
  main{
    padding:14px 10px 0;
  }
  .viewToggle{
    display:flex;
    gap:6px;
    margin-top:10px;
  }
  .viewToggle button{
    flex:1;
    background:#0d0607;
    border:1px solid var(--card-border);
    color:var(--muted);
    padding:7px 10px;
    font-size:0.72rem;
    font-family:inherit;
    text-transform:uppercase;
    letter-spacing:0.5px;
    border-radius:4px;
  }
  .viewToggle button.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#1a0507;
    font-weight:bold;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
    gap:12px;
  }
  .grid.list-view{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:6px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    transition:transform 0.1s ease, border-color 0.1s ease;
  }
  .list-view .card{
    flex-direction:row;
    align-items:center;
  }
  .card:active{transform:scale(0.98);}
  .thumb{
    width:100%;
    aspect-ratio:3/4;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
  }
  .list-view .thumb{
    width:56px;
    min-width:56px;
    aspect-ratio:3/4;
  }
  .thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .thumb.missing{
    background:repeating-linear-gradient(45deg, #1a0708, #1a0708 10px, #240a0c 10px, #240a0c 20px);
    color:var(--accent);
    font-size:0.68rem;
    text-align:center;
    padding:8px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    line-height:1.4;
  }
  .list-view .thumb.missing{
    font-size:0.45rem;
    padding:2px;
  }
  .list-view .info{
    padding:6px 10px;
  }
  .list-view .title{
    font-size:0.85rem;
  }
  .card.checked{
    opacity:0.5;
  }
  .card.checked .title{
    text-decoration:line-through;
  }
  .checkbox{
    width:22px;
    min-width:22px;
    height:22px;
    margin:0 10px;
    accent-color:var(--accent);
  }
  .list-view .checkbox{
    margin:0 6px 0 10px;
  }
  .grid:not(.list-view) .card{
    position:relative;
  }
  .grid:not(.list-view) .checkbox{
    position:absolute;
    top:6px;
    left:6px;
    margin:0;
    z-index:2;
  }
  .section-label{
    grid-column:1/-1;
    color:var(--muted);
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:1px;
    border-top:1px solid var(--card-border);
    margin-top:6px;
    padding-top:10px;
  }
  .list-view .section-label{
    margin-top:10px;
  }
  .badge{
    position:absolute;
    top:4px;
    right:4px;
    font-size:0.6rem;
    padding:2px 5px;
    border-radius:3px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    font-weight:bold;
  }
  .badge.found{background:var(--found);color:#08150c;}
  .badge.missing{background:var(--missing);color:#ffd7d7;}
  .info{
    padding:8px 8px 10px;
  }
  .title{
    font-size:0.82rem;
    font-weight:bold;
    color:var(--text);
    margin:0 0 2px;
    line-height:1.25;
  }
  .year{
    font-size:0.7rem;
    color:var(--accent2);
  }
  .note{
    font-size:0.65rem;
    color:var(--muted);
    margin-top:3px;
    font-style:italic;
  }
  .src-link{
    display:block;
    font-size:0.62rem;
    margin-top:4px;
    color:#7a9cff;
    text-decoration:none;
    word-break:break-all;
  }
  .no-results{
    text-align:center;
    color:var(--muted);
    padding:40px 10px;
    font-size:0.9rem;
  }
  footer{
    text-align:center;
    color:var(--muted);
    font-size:0.65rem;
    padding:30px 10px 10px;
  }
</style>
</head>
<body>

<header>
  <h1>&#128128; VHS Want List</h1>
  <p class="subtitle">Convention hunt list — tap search to filter</p>
  <div class="searchwrap">
    <input id="search" type="text" placeholder="Filter titles..." autocomplete="off">
  </div>
  <div class="counts"><span id="visible-count">0</span> / <span id="total-count">0</span> titles shown &middot; <span id="found-count">0</span> with box art</div>
  <div class="viewToggle">
    <button id="btn-list" type="button">List</button>
    <button id="btn-tile" type="button">Tiles</button>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="no-results" id="no-results" style="display:none;">No titles match your search.</div>
</main>

<footer>Built for the hunt. Good luck out there.</footer>

<script>
const TITLES = [{"number": 1, "title": "Pieces", "status": "found", "note": "", "image": "images/01_pieces.jpg"}, {"number": 2, "title": "The Keep", "status": "found", "note": "", "image": "images/02_the-keep.jpg"}, {"number": 3, "title": "Vamp", "status": "found", "note": "", "image": "images/03_vamp.jpg"}, {"number": 4, "title": "Cellar Dweller", "status": "found", "note": "", "image": "images/04_cellar-dweller.jpg"}, {"number": 5, "title": "Blood Diner", "status": "found", "note": "", "image": "images/05_blood-diner.jpg"}, {"number": 6, "title": "Dead Heat", "status": "found", "note": "", "image": "images/06_dead-heat.jpg"}, {"number": 7, "title": "Waxwork", "status": "found", "note": "NZ/PAL pressing shown, not US", "image": "images/07_waxwork.jpg"}, {"number": 8, "title": "Bad Taste", "status": "found", "note": "possible later reissue, not orig. era", "image": "images/08_bad-taste.jpg"}, {"number": 9, "title": "Shocker", "status": "found", "note": "", "image": "images/09_shocker.jpg"}, {"number": 10, "title": "He Knows You're Alone", "status": "found", "note": "", "image": "images/10_he-knows-youre-alone.jpg"}, {"number": 11, "title": "The Boogeyman", "status": "found", "note": "1980 orig. (not Boogeyman 2)", "image": "images/11_the-boogeyman-1980.jpg"}, {"number": 12, "title": "Boogeyman 2", "status": "found", "note": "1983 sequel (not The Boogeyman)", "image": "images/12_boogeyman-2-1983.jpg"}, {"number": 13, "title": "Christmas Evil", "status": "found", "note": "", "image": "images/13_christmas-evil.jpg"}, {"number": 14, "title": "Nail Gun Massacre", "status": "found", "note": "", "image": "images/14_nail-gun-massacre.jpg"}, {"number": 15, "title": "Sledgehammer", "status": "found", "note": "", "image": "images/15_sledgehammer.jpg"}, {"number": 16, "title": "Boarding House", "status": "found", "note": "", "image": "images/16_boarding-house.jpg"}, {"number": 17, "title": "Body Shop", "status": "found", "note": "aka Doctor Gore, same film", "image": "images/17_body-shop.jpg"}, {"number": 18, "title": "Demon Queen", "status": "found", "note": "", "image": "images/18_demon-queen.jpg"}, {"number": 19, "title": "The Vindicator", "status": "found", "note": "", "image": "images/19_the-vindicator.jpg"}, {"number": 20, "title": "Tourist Trap", "status": "found", "note": "", "image": "images/20_tourist-trap.jpg"}, {"number": 21, "title": "Re-Animator", "status": "found", "note": "", "image": "images/21_re-animator.jpg"}, {"number": 22, "title": "Bride of Re-Animator", "status": "found", "note": "Swedish reissue box shown", "image": "images/22_bride-of-re-animator.jpg"}, {"number": 23, "title": "Beyond Re-Animator", "status": "found", "note": "rare late US VHS (2003)", "image": "images/23_beyond-re-animator.jpg"}, {"number": 24, "title": "Fear No Evil", "status": "found", "note": "", "image": "images/24_fear-no-evil.jpg"}, {"number": 25, "title": "Blood Beach", "status": "found", "note": "", "image": "images/25_blood-beach.jpg"}, {"number": 26, "title": "The Hand", "status": "found", "note": "", "image": "images/26_the-hand.jpg"}, {"number": 27, "title": "Student Bodies", "status": "found", "note": "", "image": "images/27_student-bodies.jpg"}, {"number": 28, "title": "Frankenhooker", "status": "found", "note": "", "image": "images/28_frankenhooker.jpg"}, {"number": 29, "title": "Mirror Mirror", "status": "found", "note": "promo/sealed variant shown", "image": "images/29_mirror-mirror.jpg"}, {"number": 30, "title": "Video Violence", "status": "found", "note": "", "image": "images/30_video-violence.jpg"}, {"number": 31, "title": "Remote Control", "status": "found", "note": "", "image": "images/31_remote-control.jpg"}, {"number": 32, "title": "Delicatessen", "status": "not_found", "note": "no real VHS scan found"}, {"number": 33, "title": "Demonic Toys", "status": "found", "note": "", "image": "images/33_demonic-toys.jpg"}, {"number": 34, "title": "Nightbreed", "status": "found", "note": "", "image": "images/34_nightbreed.jpg"}, {"number": 35, "title": "Mimic", "status": "found", "note": "", "image": "images/35_mimic.jpg"}, {"number": 36, "title": "Cronos", "status": "found", "note": "", "image": "images/36_cronos.jpg"}, {"number": 37, "title": "Deep Rising", "status": "found", "note": "", "image": "images/37_deep-rising.jpg"}, {"number": 38, "title": "Bats", "status": "found", "note": "", "image": "images/38_bats.jpg"}, {"number": 39, "title": "The Omen", "status": "found", "note": "", "image": "images/39_the-omen.jpg"}, {"number": 40, "title": "Sleepy Hollow", "status": "found", "note": "", "image": "images/40_sleepy-hollow.jpg"}, {"number": 41, "title": "The Fog", "status": "found", "note": "", "image": "images/41_the-fog.jpg"}, {"number": 42, "title": "Prom Night", "status": "found", "note": "", "image": "images/42_prom-night.jpg"}, {"number": 43, "title": "Terror Train", "status": "found", "note": "", "image": "images/43_terror-train.jpg"}, {"number": 44, "title": "Fade to Black", "status": "found", "note": "", "image": "images/44_fade-to-black.jpg"}, {"number": 45, "title": "Inferno", "status": "found", "note": "", "image": "images/45_inferno.jpg"}, {"number": 46, "title": "Humanoids from the Deep", "status": "found", "note": "", "image": "images/46_humanoids-from-the-deep.jpg"}, {"number": 47, "title": "Alligator", "status": "found", "note": "", "image": "images/47_alligator.jpg"}, {"number": 48, "title": "Altered States", "status": "found", "note": "", "image": "images/48_altered-states.jpg"}, {"number": 49, "title": "Graduation Day", "status": "found", "note": "", "image": "images/49_graduation-day.jpg"}, {"number": 50, "title": "Dead and Buried", "status": "found", "note": "", "image": "images/50_dead-and-buried.jpg"}, {"number": 51, "title": "The Beast Within", "status": "found", "note": "", "image": "images/51_the-beast-within.jpg"}, {"number": 52, "title": "Slumber Party Massacre", "status": "found", "note": "", "image": "images/52_slumber-party-massacre.jpg"}, {"number": 53, "title": "Alone in the Dark", "status": "found", "note": "", "image": "images/53_alone-in-the-dark.jpg"}];

const grid = document.getElementById('grid');
const searchInput = document.getElementById('search');
const noResults = document.getElementById('no-results');
const visibleCountEl = document.getElementById('visible-count');
const totalCountEl = document.getElementById('total-count');
const foundCountEl = document.getElementById('found-count');

totalCountEl.textContent = TITLES.length;
foundCountEl.textContent = TITLES.filter(t => t.status === 'found').length;

const checkedSet = new Set(JSON.parse(localStorage.getItem('vhsChecked') || '[]'));

function saveChecked() {
  localStorage.setItem('vhsChecked', JSON.stringify([...checkedSet]));
}

function buildCard(t) {
  const isChecked = checkedSet.has(t.number);

  const card = document.createElement('div');
  card.className = 'card' + (isChecked ? ' checked' : '');

  const checkbox = document.createElement('input');
  checkbox.type = 'checkbox';
  checkbox.className = 'checkbox';
  checkbox.checked = isChecked;
  checkbox.setAttribute('aria-label', 'Mark ' + t.title + ' as found');
  checkbox.addEventListener('change', () => {
    if (checkbox.checked) checkedSet.add(t.number);
    else checkedSet.delete(t.number);
    saveChecked();
    render(searchInput.value);
  });
  card.appendChild(checkbox);

  const thumbWrap = document.createElement('div');
  if (t.status === 'found') {
    thumbWrap.className = 'thumb';
    const img = document.createElement('img');
    img.src = t.image;
    img.alt = t.title + ' VHS box art';
    img.loading = 'lazy';
    thumbWrap.appendChild(img);
  } else {
    thumbWrap.className = 'thumb missing';
    thumbWrap.innerHTML = '<div>&#10060;<br>No VHS box<br>art found</div>';
  }
  card.appendChild(thumbWrap);

  const info = document.createElement('div');
  info.className = 'info';
  const title = document.createElement('p');
  title.className = 'title';
  title.textContent = t.title;
  info.appendChild(title);
  card.appendChild(info);

  return card;
}

function render(filter) {
  const q = filter.trim().toLowerCase();
  grid.innerHTML = '';
  let visible = 0;

  const matches = TITLES.filter(t => !q || t.title.toLowerCase().includes(q));
  const remaining = matches.filter(t => !checkedSet.has(t.number));
  const checked = matches.filter(t => checkedSet.has(t.number));
  visible = matches.length;

  remaining.forEach(t => grid.appendChild(buildCard(t)));

  if (checked.length) {
    const label = document.createElement('div');
    label.className = 'section-label';
    label.textContent = `Found (${checked.length})`;
    grid.appendChild(label);
    checked.forEach(t => grid.appendChild(buildCard(t)));
  }

  visibleCountEl.textContent = visible;
  noResults.style.display = visible === 0 ? 'block' : 'none';
}

const btnList = document.getElementById('btn-list');
const btnTile = document.getElementById('btn-tile');

function setView(view) {
  grid.classList.toggle('list-view', view === 'list');
  btnList.classList.toggle('active', view === 'list');
  btnTile.classList.toggle('active', view === 'tile');
  localStorage.setItem('vhsView', view);
}

btnList.addEventListener('click', () => setView('list'));
btnTile.addEventListener('click', () => setView('tile'));

searchInput.addEventListener('input', e => render(e.target.value));
render('');
setView(localStorage.getItem('vhsView') === 'tile' ? 'tile' : 'list');
</script>

</body>
</html>
